name: build

# Every push to main publishes a new release, v0.3.<patch>: the patch is one
# more than the newest v0.3.* tag (0.3 began with modpacks). Pushing a tag like v1.2.3 publishes that
# exact version instead. Pull requests and manual runs only test and build.
#
# Speed: one Linux job builds both programs (Windows with MinGW; Windows
# runners are several times slower), tests run beside it, and both keep a
# Go build cache, so Fyne's C code (GLFW, OpenGL) is compiled once rather
# than on every push.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Read-only by default; only the release job can write.
permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

# What GLFW (Fyne's window library) compiles against, nothing more: the
# xorg-dev metapackage took about four minutes to install.
env:
  WINDOW_HEADERS: libgl1-mesa-dev libx11-dev libxcursor-dev libxrandr-dev libxinerama-dev libxi-dev libxxf86vm-dev libxkbcommon-dev libwayland-dev

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: test-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: test-${{ hashFiles('go.sum') }}-
      - run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends $WINDOW_HEADERS
      - run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./... && GOOS=windows CGO_ENABLED=0 go vet ./internal/steam ./internal/desktop ./internal/game ./internal/manager ./internal/selfupdate
      - run: go test ./...

  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: release-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: release-${{ hashFiles('go.sum') }}-
      - name: Pick version
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            v="${GITHUB_REF_NAME}"
          elif [ "${GITHUB_REF}" = refs/heads/main ] && [ "${GITHUB_EVENT_NAME}" = push ]; then
            last=$(git ls-remote --tags "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" 'refs/tags/v0.3.*' \
              | grep -oE 'v0\.3\.[0-9]+' | cut -d. -f3 | sort -n | tail -1)
            v="v0.3.$(( ${last:--1} + 1 ))"
          else
            v="v0.0.0-dev.${GITHUB_RUN_NUMBER}"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Building $v"
      - name: Toolchains (window headers, MinGW for Windows)
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends $WINDOW_HEADERS gcc-mingw-w64-x86-64
      - name: Windows icon and version info
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          go install github.com/tc-hib/go-winres@v0.3.3 # module checksum verified by sum.golang.org
          num=$(echo "${VERSION#v}" | sed -E 's/^([0-9]+)\.([0-9]+)\.([0-9]+).*/\1.\2.\3/')
          case "$num" in *[!0-9.]*|"") num=0.0.0 ;; esac
          ~/go/bin/go-winres simply --arch amd64 --out cmd/wbmm/rsrc \
            --icon internal/desktop/icons/icon-256.png --manifest gui \
            --product-name "WorldBox Mod Manager" --file-description "WorldBox Mod Manager" \
            --original-filename wbmm.exe --product-version "$num.0" --file-version "$num.0"
      - name: Build
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          mkdir dist
          flags="-s -w -X main.version=${VERSION}"
          export CGO_ENABLED=1 GOARCH=amd64
          GOOS=linux go build -trimpath -ldflags "$flags" -o dist/wbmm-linux-amd64 ./cmd/wbmm & a=$!
          # A GUI program: no console window on double-click.
          GOOS=windows CC=x86_64-w64-mingw32-gcc go build -trimpath -ldflags "$flags -H windowsgui" -o dist/wbmm-windows-amd64.exe ./cmd/wbmm & b=$!
          wait $a && wait $b
          # The version line is signed with the checksums: wbmm refuses a
          # signed file that names another version (no rollbacks).
          cd dist && sha256sum * > SHA256SUMS.txt && echo "# wbmm ${VERSION}" >> SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wbmm-${{ steps.ver.outputs.version }}
          path: dist/*

  release:
    needs: [test, build]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: wbmm-${{ needs.build.outputs.version }}
          path: dist
      # wbmm's self-update only trusts a SHA256SUMS.txt signed with the
      # release key (Ed25519; the secret is used by this step alone).
      - name: Sign checksums
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          umask 077
          key=$(mktemp)
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$RELEASE_SIGNING_KEY" > "$key"
          openssl pkeyutl -sign -rawin -inkey "$key" -in dist/SHA256SUMS.txt | base64 -w0 > dist/SHA256SUMS.txt.sig
          test -s dist/SHA256SUMS.txt.sig
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ needs.build.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: wbmm ${{ needs.build.outputs.version }}
          generate_release_notes: true
          make_latest: true
          body: |
            **Windows:** download `wbmm-windows-amd64.exe` and double-click it, then click **Install** in the banner. It adds WorldBox Mod Manager to the Start menu and desktop (no admin needed); you can delete the download afterwards. SmartScreen may warn because the program isn't code-signed: choose "More info" → "Run anyway".
            **Linux:** download `wbmm-linux-amd64`, run `chmod +x wbmm-linux-amd64 && ./wbmm-linux-amd64`, then click **Install**. It goes to `~/.local/bin` with an app-menu entry and desktop shortcut.
            Already installed? wbmm updates itself.

            Verify downloads against `SHA256SUMS.txt` (signed: `SHA256SUMS.txt.sig`).
          files: dist/*
