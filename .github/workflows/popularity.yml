name: popularity

# Once a day, record GameBanana downloads and Steam Workshop subscriptions
# for WorldBox, and publish what gained the most in the last day, week and
# month (popularity.json on the popularity-data branch, read by wbmm). No
# database and no secrets: the data is public and lives in this repository.
# It also reads the mod.json files of new GameBanana uploads (never running
# anything) to know which item installs each mod ID, for dependencies.
# Snapshots older than 31 days are deleted and the branch is rewritten as a
# single commit each run, so it never grows.
on:
  schedule:
    - cron: "00 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: popularity
  cancel-in-progress: false

jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Fix repository remote
        run: git remote set-url origin "https://github.com/${{ github.repository }}.git"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: Fetch previous snapshots
        run: |
          if git ls-remote --exit-code --heads origin popularity-data >/dev/null; then
            git fetch --depth 1 origin popularity-data
            git worktree add data FETCH_HEAD
          else
            mkdir data
          fi
      - name: Record today and rank
        run: go run ./cmd/popindex -dir data
      - name: Publish
        run: |
          out=$(mktemp -d)
          cp -r data/snapshots data/popularity.json "$out"/
          if [ -f data/provides-cache.json ]; then cp data/provides-cache.json "$out"/; fi
          cd "$out"
          git init -q -b popularity-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Popularity snapshot $(date -u +%F)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" popularity-data:popularity-data
